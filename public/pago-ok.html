<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Pago Recibido</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:linear-gradient(135deg,#0f172a,#1e3a5f);font-family:'Inter',-apple-system,sans-serif;padding:24px}
    .card{background:white;border-radius:24px;padding:44px 36px;max-width:420px;width:100%;text-align:center;box-shadow:0 32px 80px rgba(0,0,0,.3)}
    .icon{font-size:64px;margin-bottom:16px}
    h1{font-size:26px;font-weight:800;color:#0f172a;margin-bottom:10px}
    p{font-size:15px;color:#64748b;line-height:1.6;margin-bottom:24px}
    .badge{display:inline-flex;align-items:center;gap:8px;background:#dcfce7;color:#15803d;
           border-radius:100px;padding:10px 20px;font-weight:700;font-size:14px;margin-bottom:28px}
    .btn{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:white;
         border:none;border-radius:14px;padding:14px 28px;font-size:15px;font-weight:700;
         cursor:pointer;text-decoration:none;transition:all .15s}
    .btn:hover{background:#1eb854;transform:translateY(-1px)}
    .note{font-size:12px;color:#aaa;margin-top:20px;line-height:1.6}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>¡Pago recibido!</h1>
    <p>Tu pago fue procesado exitosamente. Nuestro equipo verificará el pago y confirmará tu cita a la brevedad.</p>
    <div class="badge">🔔 Cita en proceso de confirmación</div>
    <br/>
    <a class="btn" id="btnWa" href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      Volver a WhatsApp
    </a>
    <p class="note">Recibirás una confirmación por WhatsApp cuando tu cita sea aprobada por nuestro equipo.</p>
  </div>
  <script>
    // Abrir conversación de WhatsApp con el número de la clínica
    const params = new URLSearchParams(window.location.search);
    const numero = params.get('numero') || '50760291411';
    document.getElementById('btnWa').href = `https://wa.me/${numero}`;
  </script>
</body>
</html>
